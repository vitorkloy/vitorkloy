<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="Vitor AI Core">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12081f"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer frame -->
  <rect x="8" y="8" width="664" height="404" rx="18" fill="#0a0614" stroke="#6d28d9" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="20" y="20" width="640" height="380" rx="14" fill="#110a22" stroke="#4c1d95" stroke-opacity="0.5"/>

  <!-- title chip -->
  <rect x="40" y="42" width="200" height="36" rx="8" fill="#1e1038" stroke="#7c3aed" stroke-opacity="0.8"/>
  <text x="140" y="66" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="700" fill="#e9d5ff">VITOR SYSTEM v2.0</text>

  <text x="40" y="110" font-family="Consolas, Monaco, monospace" font-size="16" fill="#c4b5fd">Initializing system...</text>

  <!-- progress track -->
  <rect x="40" y="130" width="600" height="16" rx="8" fill="#1a122e"/>
  <rect x="40" y="130" width="600" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>
  <text x="640" y="122" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="12" fill="#a78bfa">100%</text>

  <!-- checklist -->
  <g font-family="Consolas, Monaco, monospace" font-size="18" fill="#d1d5db">
    <text x="48" y="190" fill="#34d399"></text>
    <text x="80" y="190">Developer detected</text>

    <text x="48" y="230" fill="#34d399"></text>
    <text x="80" y="230">Creativity enabled</text>

    <text x="48" y="270" fill="#34d399"></text>
    <text x="80" y="270">Code engine activated</text>

    <text x="48" y="310" fill="#34d399"></text>
    <text x="80" y="310">Projects loaded</text>
  </g>

  <text x="40" y="360" font-family="Consolas, Monaco, monospace" font-size="20" font-weight="700" fill="#f5f3ff" filter="url(#glow)">STATUS: ONLINE =ù</text>
</svg>
