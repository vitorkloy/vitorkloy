<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Vitor Kloy">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0618"/>
      <stop offset="45%" stop-color="#1a0b3a"/>
      <stop offset="100%" stop-color="#2a1060"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0b0618" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#orb)"/>

  <!-- subtle grid -->
  <g stroke="#a78bfa" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360 M600 0 V360 M700 0 V360 M800 0 V360 M900 0 V360 M1000 0 V360 M1100 0 V360"/>
  </g>

  <rect x="80" y="178" width="1040" height="2" fill="url(#glow)"/>

  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="8" fill="#ffffff" filter="url(#softGlow)">VITOR KLOY</text>
  <text x="600" y="210" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="18" letter-spacing="4" fill="#c4b5fd">FULL-STACK DEVELOPER  "  NEXT.JS  "  REACT</text>
  <text x="600" y="250" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="14" fill="#7c6aaf">São José dos Campos, SP</text>
</svg>
